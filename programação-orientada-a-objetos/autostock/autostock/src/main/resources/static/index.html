<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoStock</title>
<style>
:root{font-family:Arial,sans-serif;color:#1f2937;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.top{background:#111827;color:white;padding:20px 5%}.top h1{margin:0}.top p{margin:5px 0 0;color:#d1d5db}.wrap{width:min(1180px,92%);margin:24px auto}.card{background:white;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #0001}h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white}textarea{min-height:70px}button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:bold}.primary{background:#2563eb;color:white}.secondary{background:#e5e7eb}.danger{background:#dc2626;color:white}.success{background:#059669;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}th{background:#f8fafc}.msg{display:none;padding:10px;border-radius:7px;margin-bottom:14px}.msg.ok{display:block;background:#dcfce7}.msg.erro{display:block;background:#fee2e2}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.two{grid-template-columns:1fr}}small{color:#64748b}
</style></head><body><header class="top"><h1>AutoStock</h1><p>Sistema Automotivo — Gestão de Estoque de Veículos</p></header><main class="wrap"><div id="msg" class="msg"></div>
<section class="card"><h2>Filtros do estoque</h2><div class="grid"><div><label>Marca</label><select id="fMarca" onchange="carregarModelos('fMarca','fModelo',true)"><option value="">Todas</option></select></div><div><label>Modelo</label><select id="fModelo"><option value="">Todos</option></select></div><div><label>Ano</label><input id="fAno" type="number"></div><div><label>Status</label><select id="fStatus"></select></div><div><label>Preço mínimo</label><input id="fMin" inputmode="decimal"></div><div><label>Preço máximo</label><input id="fMax" inputmode="decimal"></div></div><div class="actions"><button class="primary" onclick="listarVeiculos(true)">Pesquisar</button><button class="secondary" onclick="limparFiltros()">Limpar</button></div></section>
<section class="card"><h2 id="tituloVeiculo">Cadastrar veículo</h2><input type="hidden" id="vId"><div class="grid"><div><label>Marca</label><select id="vMarca" onchange="carregarModelos('vMarca','vModelo',true)"><option value="">Selecione</option></select></div><div><label>Modelo</label><select id="vModelo"><option value="">Selecione</option></select></div><div><label>Ano</label><input id="vAno" type="number" min="1886" max="2100"></div><div><label>Cor</label><input id="vCor"></div><div><label>Preço (R$)</label><input id="vPreco" inputmode="decimal"></div><div><label>Quilometragem</label><input id="vKm" type="number" min="0"></div><div><label>Status</label><select id="vStatus"></select></div><div><label>Observação</label><textarea id="vObs"></textarea></div></div><div class="actions"><button class="success" onclick="salvarVeiculo()">Salvar veículo</button><button class="secondary" onclick="limparFormularioVeiculo()">Cancelar/Limpar</button></div></section>
<section class="card"><h2>Veículos em estoque</h2><div class="tablebox"><table><thead><tr><th>ID</th><th>Marca</th><th>Modelo</th><th>Ano</th><th>Cor</th><th>Preço</th><th>KM</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
<div class="two"><section class="card"><h2>Marcas</h2><div class="grid"><div><label>Nome da marca</label><input id="mNome"></div></div><div class="actions"><button class="primary" onclick="salvarMarca()">Cadastrar marca</button></div><div id="listaMarcas"></div></section><section class="card"><h2>Modelos</h2><div class="grid"><div><label>Marca</label><select id="moMarca"><option value="">Selecione</option></select></div><div><label>Nome do modelo</label><input id="moNome"></div></div><div class="actions"><button class="primary" onclick="salvarModelo()">Cadastrar modelo</button></div><div id="listaModelos"></div></section></div>
</main><script>
const A='/api'; const STATUS=['DISPONIVEL','FINANCIADO','EM_NEGOCIACAO','LEILAO','SINISTRADO','VENDIDO','DESCONTINUADO']; const labels={DISPONIVEL:'Disponível',FINANCIADO:'Financiado',EM_NEGOCIACAO:'Em negociação',LEILAO:'Leilão',SINISTRADO:'Sinistrado',VENDIDO:'Vendido',DESCONTINUADO:'Descontinuado'}; let marcas=[],modelos=[];
function aviso(t,erro=false){let e=document.getElementById('msg');e.textContent=t;e.className='msg '+(erro?'erro':'ok');setTimeout(()=>e.className='msg',4500)}
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok){let x={};try{x=await r.json()}catch{};throw new Error(x.mensagem||`Erro HTTP ${r.status}`)}return r.status===204?null:r.json()}
function moeda(v){return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} function decimal(v){if(!v)return null;v=String(v).trim().replace(/\s/g,'');if(v.includes(',')&&v.includes('.'))v=v.replace(/\./g,'').replace(',','.');else if(v.includes(','))v=v.replace(',','.');return Number(v)}
function preencherStatus(){fStatus.innerHTML='<option value="">Todos</option>'+STATUS.map(s=>`<option value="${s}">${labels[s]}</option>`).join('');vStatus.innerHTML=STATUS.map(s=>`<option value="${s}">${labels[s]}</option>`).join('')}
async function carregarMarcas(){marcas=await api(A+'/marcas'); for(const id of ['vMarca','fMarca','moMarca']){let s=document.getElementById(id), atual=s.value, first=id==='fMarca'?'Todas':'Selecione';s.innerHTML=`<option value="">${first}</option>`+marcas.map(m=>`<option value="${m.id}">${m.nome}</option>`).join('');s.value=atual} listaMarcas.innerHTML='<hr>'+marcas.map(m=>`<p>${m.nome} <button class="danger" onclick="excluirMarca(${m.id})">Excluir</button></p>`).join('')}
async function carregarTodosModelos(){modelos=await api(A+'/modelos');listaModelos.innerHTML='<hr>'+modelos.map(m=>`<p>${m.marca.nome} — ${m.nome} <button class="danger" onclick="excluirModelo(${m.id})">Excluir</button></p>`).join('')}
async function carregarModelos(marcaSelect,modeloSelect,reset=false){let mid=document.getElementById(marcaSelect).value,s=document.getElementById(modeloSelect);if(!mid){s.innerHTML=`<option value="">${modeloSelect==='fModelo'?'Todos':'Selecione'}</option>`;return}let arr=await api(A+'/modelos?marcaId='+mid),atual=reset?'':s.value;s.innerHTML=`<option value="">${modeloSelect==='fModelo'?'Todos':'Selecione'}</option>`+arr.map(m=>`<option value="${m.id}">${m.nome}</option>`).join('');s.value=atual}
async function listarVeiculos(filtro=false){try{let url=A+'/veiculos';if(filtro){let q=new URLSearchParams();[['marcaId',fMarca.value],['modeloId',fModelo.value],['ano',fAno.value],['status',fStatus.value]].forEach(([k,v])=>{if(v)q.set(k,v)});if(fMin.value)q.set('precoMinimo',decimal(fMin.value));if(fMax.value)q.set('precoMaximo',decimal(fMax.value));url+='/pesquisar?'+q}let vs=await api(url);tbody.innerHTML=vs.length?vs.map(v=>`<tr><td>${v.id}</td><td>${v.modelo.marca.nome}</td><td>${v.modelo.nome}</td><td>${v.ano}</td><td>${v.cor}</td><td>${moeda(v.preco)}</td><td>${Number(v.quilometragem).toLocaleString('pt-BR')}</td><td>${labels[v.status]||v.status}</td><td><button class="primary" onclick="editarVeiculo(${v.id})">Editar</button> <button class="danger" onclick="excluirVeiculo(${v.id})">Excluir</button></td></tr>`).join(''):'<tr><td colspan="9">Nenhum veículo encontrado.</td></tr>'}catch(e){aviso(e.message,true)}}
async function salvarVeiculo(){try{if(!vModelo.value)throw new Error('Selecione marca e modelo.');let body={modelo:{id:Number(vModelo.value)},ano:Number(vAno.value),cor:vCor.value,preco:decimal(vPreco.value),quilometragem:Number(vKm.value),status:vStatus.value,observacao:vObs.value};let id=vId.value;await api(A+'/veiculos'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(body)});aviso(id?'Veículo atualizado.':'Veículo cadastrado.');limparFormularioVeiculo();await listarVeiculos();}catch(e){aviso(e.message,true)}}
async function editarVeiculo(id){try{let v=await api(A+'/veiculos/'+id);vId.value=v.id;vMarca.value=v.modelo.marca.id;await carregarModelos('vMarca','vModelo');vModelo.value=v.modelo.id;vAno.value=v.ano;vCor.value=v.cor;vPreco.value=v.preco;vKm.value=v.quilometragem;vStatus.value=v.status;vObs.value=v.observacao||'';tituloVeiculo.textContent='Editar veículo #'+id;window.scrollTo({top:300,behavior:'smooth'})}catch(e){aviso(e.message,true)}}
async function excluirVeiculo(id){if(!confirm('Excluir este veículo do estoque?'))return;try{await api(A+'/veiculos/'+id,{method:'DELETE'});aviso('Veículo excluído.');await listarVeiculos()}catch(e){aviso(e.message,true)}}
function limparFormularioVeiculo(){vId.value='';vMarca.value='';vModelo.innerHTML='<option value="">Selecione</option>';vAno.value='';vCor.value='';vPreco.value='';vKm.value='';vStatus.value='DISPONIVEL';vObs.value='';tituloVeiculo.textContent='Cadastrar veículo'}
function limparFiltros(){fMarca.value='';fModelo.innerHTML='<option value="">Todos</option>';fAno.value='';fStatus.value='';fMin.value='';fMax.value='';listarVeiculos()}
async function salvarMarca(){try{await api(A+'/marcas',{method:'POST',body:JSON.stringify({nome:mNome.value})});mNome.value='';aviso('Marca cadastrada.');await carregarMarcas()}catch(e){aviso(e.message,true)}}
async function salvarModelo(){try{await api(A+'/modelos',{method:'POST',body:JSON.stringify({nome:moNome.value,marca:{id:Number(moMarca.value)}})});moNome.value='';aviso('Modelo cadastrado.');await carregarTodosModelos()}catch(e){aviso(e.message,true)}}
async function excluirMarca(id){if(!confirm('Excluir esta marca?'))return;try{await api(A+'/marcas/'+id,{method:'DELETE'});aviso('Marca excluída.');await carregarMarcas()}catch(e){aviso(e.message,true)}}
async function excluirModelo(id){if(!confirm('Excluir este modelo?'))return;try{await api(A+'/modelos/'+id,{method:'DELETE'});aviso('Modelo excluído.');await carregarTodosModelos()}catch(e){aviso(e.message,true)}}
(async()=>{try{preencherStatus();await carregarMarcas();await carregarTodosModelos();await listarVeiculos()}catch(e){aviso('Não foi possível iniciar o sistema: '+e.message,true)}})();
</script></body></html>
